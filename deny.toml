[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained and has no replacement; it comes in through serde_yaml in rngo-cli, which only parses the user's own spec files" },
    { id = "RUSTSEC-2026-0367", reason = "zip has no patched release; only ZipArchive::extract is affected and `rngo skills` extracts an archive it downloads from GitHub into a temp directory" },
    { id = "RUSTSEC-2026-0368", reason = "zip has no patched release; see RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0369", reason = "zip has no patched release; see RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0429", reason = "zip has no patched release; see RUSTSEC-2026-0367" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
