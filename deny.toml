[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained and has no replacement; it comes in through serde_yaml in rngo-cli, which only parses the user's own spec files" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade and no advisory describes a vulnerability in it; it is a direct dependency of rngo and rngo-cli and also comes in through cel, so it clears only by replacing it in both and moving cel off it" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
