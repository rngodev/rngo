[package]
name = "rngo-proxy"
version = "0.36.0"
edition = "2024"
description = "Channel dispatch and output formatting for rngo simulations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rngodev/rngo-rs"
homepage = "https://rngo.dev"
keywords = ["simulation", "testing", "data", "codegen"]
categories = ["development-tools::testing", "simulation"]

[dependencies]
rngo-core = { version = "0.36.0", path = "../core" }
rngo-log = { version = "0.36.0", path = "../log" }
serde_json = "1.0.138"
chrono = "0.4.44"
handlebars = "6"

[dev-dependencies]
tempfile = "3"
