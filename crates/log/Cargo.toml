[package]
name = "rngo-log"
version = "0.36.0"
edition = "2024"
description = "Run-log persistence for rngo simulations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rngodev/rngo-rs"
homepage = "https://rngo.dev"
keywords = ["simulation", "testing", "data", "codegen"]
categories = ["development-tools::testing", "simulation"]

[dependencies]
rngo-core = { version = "0.36.0", path = "../core" }
rand = { version = "0.10.1", features = ["serde"] }
rand_pcg = { version = "0.10.2", features = ["serde"] }
rand_seeder = "0.5.0"
serde_json = "1.0.138"
chrono = "0.4.44"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
