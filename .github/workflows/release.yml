name: release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - name: Check the versions match the tag
        run: |
          for manifest in crates/rngo/Cargo.toml crates/cli/Cargo.toml; do
            version=$(grep -m1 '^version' "$manifest" | sed -E 's/version *= *"([^"]+)"/\1/')
            if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
              echo "Error: $manifest has version $version but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - name: Check the changelog has an entry for the tag
        run: bash scripts/changelog-section.sh "$GITHUB_REF_NAME" > /dev/null
      - name: Check rngo can be published
        run: cargo publish -p rngo --dry-run
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: bash scripts/changelog-section.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create release
        uses: softprops/action-gh-release@v2.2.2
        with:
          body_path: release-notes.md
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin_ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_ext: ".exe"
    name: Build for ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build -p rngo-cli --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          BIN=rngo${{ matrix.bin_ext }}
          ZIP=rngo-${{ github.ref_name }}-${{ matrix.target }}.zip

          mkdir -p dist
          cp target/${{ matrix.target }}/release/${BIN} dist/${BIN}
          cd dist

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a $ZIP $BIN
          else
            zip $ZIP $BIN
          fi
      - name: Add files to release
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: dist/*.zip
  crates:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rngo --verbose
          cargo publish -p rngo-cli --verbose
